# 容器内使用的配置模板（路径都已指向 /data 卷）。
# 首次启动时，Dockerfile 会把它复制到 /data/config.example.yaml。
cloud:
  base_url: https://cloud.astrbot.app/api/v1
  storage_state: /data/storage_state.json
  # 也可以走环境变量 AMP_CLOUD_STORAGE_STATE 直接内联 JSON
  timeout_seconds: 30

github:
  token: ${GITHUB_TOKEN:-}
  api_url: https://api.github.com

watch:
  interval_seconds: 300
  jitter_seconds: 15
  repositories: []

submission:
  dry_run: false
  skip_if_pending: true
  max_submissions_per_24h: 3
  min_interval_seconds: 600
  respect_cloud_limits: true

state:
  path: /data/state.sqlite3

notify:
  enabled: false
  webhook_url: ${AMP_NOTIFY_WEBHOOK:-}

logging:
  level: INFO
