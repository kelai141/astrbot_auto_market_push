[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrbot-auto-market-push"
version = "0.1.0"
description = "跟踪 GitHub 仓库，在 metadata.yaml 版本变化时自动把 AstrBot 插件送审到插件市场"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "kelai141" }]
keywords = ["astrbot", "plugin-market", "automation", "github", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
astrbot-auto-market-push = "astrbot_auto_market_push.cli:main"
ampush = "astrbot_auto_market_push.cli:main"

[project.urls]
Repository = "https://github.com/kelai141/astrbot_auto_market_push"
Issues = "https://github.com/kelai141/astrbot_auto_market_push/issues"

[tool.hatch.build.targets.wheel]
packages = ["astrbot_auto_market_push"]

[tool.hatch.build.targets.sdist]
include = [
    "/astrbot_auto_market_push",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/config.example.yaml",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "TRY", "BLE"]
ignore = [
    # `typing.Self` is 3.11+; the AstrBot plugin target still supports 3.10.
    "PYI034",
    # TRY003: long, explicit exception messages are intentional here.
    "TRY003",
    # EM101/EM102 style rules are not enabled, but TRY004 is noisy for our domain.
    "TRY004",
    # Structured domain errors already carry actionable context; a stack trace
    # for an expected `SessionExpiredError` / `CloudAPIError` is just noise.
    "TRY400",
    # The project is Chinese-first: fullwidth punctuation in strings/docstrings
    # and comments is intentional, not an accident.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TRY301", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:astrbot_auto_market_push.*"]
